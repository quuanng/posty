name: Internship notifier

on:
  schedule:
    - cron: "*/6 * * * *"     # every 6 min
  workflow_dispatch:          # lets you click "Run workflow" manually
    inputs:
      test:
        description: "Just send a test message to Discord"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit state.json back to the repo

concurrency:
  group: notifier             # never let two runs overlap
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Filters live in config.toml - this block is only secrets.
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # Optional: separate channels. Leave the secrets unset to use the one above.
      DISCORD_WEBHOOK_URL_OFFSEASON: ${{ secrets.DISCORD_WEBHOOK_URL_OFFSEASON }}
      DISCORD_WEBHOOK_URL_NEWGRAD: ${{ secrets.DISCORD_WEBHOOK_URL_NEWGRAD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test message
        if: ${{ inputs.test }}
        run: python notifier.py --test

      - name: Check for new listings
        if: ${{ !inputs.test }}
        run: python notifier.py

      - name: Save state
        if: ${{ !inputs.test }}
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update seen listings" --quiet
            git push --quiet
          fi
